name: automated_screenshot_connector
description: App-side Flutter connector for the automated-application-screenshots demo recording tool (network mode).
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.13.1
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  # Upstream 2.0.25 still calls jcenter(); Gradle 9 removed it. Fork with the fix.
  flutter_screen_recording:
    git:
      url: https://github.com/BenjaminKobjolke/flutter_screen_recording.git
      ref: e3b7ac61a38b4bb64fa82feba5d2729ab99f7e3a
      path: flutter_screen_recording

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
